[platformio]
default_envs = tdisplay

; Shared settings. FW_VERSION is defined here only (AGENTS.md, Firmware versioning).
[env]
build_flags =
    -D FW_VERSION=\"0.0.15\"

; LilyGO TTGO T-Display (BOARDS.md)
[env:tdisplay]
platform = espressif32@7.0.1
board = lilygo-t-display
framework = arduino
monitor_speed = 115200
; Two 1.9 MB app slots and 128 KB LittleFS; BLE provisioning needs more than the default 1.25 MB (PROJECT.md D-024).
board_build.partitions = min_spiffs.csv
lib_deps =
    moononournation/GFX Library for Arduino@1.6.0
    olikraus/U8g2@2.36.18
    bblanchon/ArduinoJson@7.4.3
; The board folder holds board.h, pins.h, and display.h (PROJECT.md D-030).
; Arduino_GFX 1.6.0 is the newest release that builds on Arduino core 2.x (D-031).
build_flags =
    ${env.build_flags}
    -Iinclude/boards/tdisplay

; Host-side unit tests for hardware-independent logic: pio test -e native
[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@7.4.3
