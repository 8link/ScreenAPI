[platformio]
default_envs = tdisplay

; Shared settings. FW_VERSION is defined here only (AGENTS.md, Firmware versioning).
[env]
build_flags =
    -D FW_VERSION=\"0.0.14\"

; LilyGO TTGO T-Display (BOARDS.md)
[env:tdisplay]
platform = espressif32@7.0.1
board = lilygo-t-display
framework = arduino
monitor_speed = 115200
; Two 1.9 MB app slots and 128 KB LittleFS; BLE provisioning needs more than the default 1.25 MB (PROJECT.md D-024).
board_build.partitions = min_spiffs.csv
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.4.3
; The board folder holds board.h, pins.h, and tft_setup.h (PROJECT.md D-030).
; -I also puts it on the library include path, so TFT_eSPI finds tft_setup.h.
; Without it the library silently compiles with its own default setup while
; src/ uses ours (PROJECT.md D-013).
build_flags =
    ${env.build_flags}
    -Iinclude/boards/tdisplay

; Host-side unit tests for hardware-independent logic: pio test -e native
[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@7.4.3
