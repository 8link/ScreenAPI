[platformio]
default_envs = tdisplay

; The firmware version lives in the VERSION file, not here: PlatformIO rebuilds
; everything whenever this file changes. tools/version.py passes it to src/ as
; FW_VERSION (AGENTS.md, Firmware versioning; PROJECT.md D-035).

; Common to all ESP32 boards. Arduino_GFX 1.6.0 is the newest release that
; builds on Arduino core 2.x (D-031). Build with -j 2: the U8g2 font source
; needs about 1 GB per compiler job.
[esp32]
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
extra_scripts = post:tools/version.py
lib_deps =
    moononournation/GFX Library for Arduino@1.6.0
    olikraus/U8g2@2.36.18
    bblanchon/ArduinoJson@7.4.3

; Each board: board.h and pins.h in include/boards/<board>/, hardware layer in
; src/boards/<board>/ (PROJECT.md D-030, D-032). Only that board's folder is compiled.

; LilyGO TTGO T-Display (BOARDS.md)
[env:tdisplay]
extends = esp32
board = lilygo-t-display
; Two 1.9 MB app slots and 128 KB LittleFS; BLE provisioning needs more than the default 1.25 MB (PROJECT.md D-024).
board_build.partitions = min_spiffs.csv
build_flags =
    -Iinclude/boards/tdisplay
build_src_filter = +<*> -<boards/> +<boards/tdisplay/>

; Waveshare ESP32-S3-Touch-AMOLED-1.8 (BOARDS.md): 16 MB flash, 8 MB octal PSRAM,
; native USB serial. The partition layout matches what the board shipped with.
[env:waveshare_amoled18]
extends = esp32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
    ${esp32.lib_deps}
    lewisxhe/XPowersLib@0.3.3
build_flags =
    -Iinclude/boards/waveshare_amoled18
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<boards/> +<boards/waveshare_amoled18/>

; Template board: a generic ESP32 with an SPI display (include/boards/template/,
; src/boards/template/). Built to keep the porting template compilable; not a real board.
[env:template]
extends = esp32
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
    -Iinclude/boards/template
build_src_filter = +<*> -<boards/> +<boards/template/>

; Host-side unit tests for hardware-independent logic: pio test -e native
[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@7.4.3
